# This file is used to specify the build script for the project, which compiles the protobuf files into Rust code.
# Version numbers may be diferent based on the module instructions, but the structure should be similar.

[package]
name = "grpc-tutorial"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "grpc-server"
path = "src/grpc_server.rs"

[[bin]]
name = "grpc-client"
path = "src/grpc_client.rs"

[dependencies]
tonic = "0.14.5"
prost = "0.14.3"
tonic-prost = "0.14.5"
tokio = { version = "1.52.2", features = ["full"] }
tokio-stream = "0.1.18"

[build-dependencies]
tonic-prost-build = "0.14.5"
protoc-bin-vendored = "3.2.0"
